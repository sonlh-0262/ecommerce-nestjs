name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  static:
    name: Lint, type-check, format and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check (including test/)
        run: npm run typecheck

      - name: Build
        run: npm run build

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Run unit tests
        run: npm run test -- --ci --runInBand

  e2e:
    name: E2E tests and migrations
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ecommerce_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6381:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      NODE_ENV: test
      BCRYPT_SALT_ROUNDS: 4

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Apply migrations
        run: npm run migration:run

      - name: Show migration status
        run: npm run migration:show

      - name: Verify migrations revert cleanly
        run: |
          npm run migration:revert
          npm run migration:run

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Refuse a database that is not a test database
        env:
          DB_DATABASE: ecommerce
        run: |
          set -o pipefail
          if npm run test:e2e -- app.e2e-spec --forceExit 2>&1 | tee db-guard.log; then
            echo "::error::The e2e harness accepted a non-test database."
            exit 1
          fi
          grep -q 'Refusing to run the e2e suite against' db-guard.log

      - name: Refuse a Redis key prefix that is not a test prefix
        env:
          REDIS_KEY_PREFIX: 'ecommerce:'
        run: |
          set -o pipefail
          if npm run test:e2e -- app.e2e-spec --forceExit 2>&1 | tee redis-guard.log; then
            echo "::error::The e2e harness accepted a non-test Redis prefix."
            exit 1
          fi
          grep -q 'Refusing to run the e2e suite with the Redis key prefix' redis-guard.log

      - name: Refuse a storage root that is not a test storage root
        env:
          STORAGE_ROOT: ./storage
        run: |
          set -o pipefail
          if npm run test:e2e -- app.e2e-spec --forceExit 2>&1 | tee storage-guard.log; then
            echo "::error::The e2e harness accepted a non-test storage root."
            exit 1
          fi
          grep -q 'Refusing to run the e2e suite with STORAGE_ROOT' storage-guard.log

  docker:
    name: Production image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the production stage
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
